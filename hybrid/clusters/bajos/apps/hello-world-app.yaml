# Execution plane: este Application lo crea y lo reconcilia el Argo CD LOCAL del spoke bajos.
# Si el hub se cae, este cluster sigue sincronizando desde Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-hybrid
  namespace: openshift-gitops
  labels:
    kcd.demo/model: hybrid
    kcd.demo/plane: execution
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: hello-world-hybrid
  source:
    repoURL: https://github.com/rofrba/argo-multicluster.git
    targetRevision: main
    # Kustomize: base + envs/bajos + components/hybrid
    path: manifests/hello-world/deploy/hybrid/bajos
  destination:
    server: https://kubernetes.default.svc
    namespace: kcd-hybrid-bajos   # ya existe: lo creó el hub con sus guardrails
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
