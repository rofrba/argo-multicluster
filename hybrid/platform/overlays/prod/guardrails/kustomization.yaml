apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kcd-hybrid-prod

components:
- ../../../base/guardrails

patches:
- target:
    kind: Namespace
    name: team-namespace
  patch: |-
    - op: replace
      path: /metadata/name
      value: kcd-hybrid-prod
- target:
    kind: ResourceQuota
    name: team-quota
  patch: |-
    - op: replace
      path: /spec/hard
      value:
        pods: "10"
        requests.cpu: 500m
        requests.memory: 1Gi
        limits.cpu: "2"
        limits.memory: 2Gi
