apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Se aplica UNA vez, a mano, logueado en el spoke prod:  oc apply -k pull/bootstrap/prod
resources:
- ../base

patches:
- target:
    kind: Application
    name: pull-root
  patch: |-
    - op: replace
      path: /spec/source/path
      value: pull/clusters/prod
