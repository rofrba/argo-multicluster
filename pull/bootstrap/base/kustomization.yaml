apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base común del bootstrap PULL. Cada spoke tiene su overlay (bajos/, prod/)
# que sólo cambia a qué carpeta de Git apunta su root app.
namespace: openshift-gitops

resources:
- appproject.yaml
- repository.yaml
- rbac.yaml
- root-app.yaml
