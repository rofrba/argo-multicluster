apiVersion: v1
kind: ConfigMap
metadata:
  name: html-template-push
  labels:
    app: hello-world-push
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Entorno OpenShift</title>
        <style>
            body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f4f8; margin: 0; }
            .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
            h1 { color: #1e293b; font-size: 1.5rem; margin-bottom: 1rem; }
            p { color: #64748b; margin-bottom: 1.5rem; }
            .badge { background: #ee0000; color: white; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: bold; font-size: 1.1rem; display: inline-block; }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Despliegue en OpenShift</h1>
            <p>El valor de la variable de entorno actual es:</p>
            <div class="badge">VALUE_MI_ENTORNO</div>
        </div>
    </body>
    </html>