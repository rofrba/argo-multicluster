apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Lo que depende del MODELO (hybrid). Un Component se puede "enchufar" a cualquier entorno.
# Mismos colores que el Decision Framework de la charla.
labels:
- pairs:
    kcd.demo/model: hybrid

configMapGenerator:
- name: app-config
  behavior: merge
  literals:
  - MI_MODELO=HYBRID
  - MI_COLOR=#8b5cf6
