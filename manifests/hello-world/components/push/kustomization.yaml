apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Lo que depende del MODELO (push). Un Component se puede "enchufar" a cualquier entorno.
# Mismos colores que el Decision Framework de la charla.
labels:
- pairs:
    kcd.demo/model: push

configMapGenerator:
- name: app-config
  behavior: merge
  literals:
  - MI_MODELO=PUSH
  - MI_COLOR=#f97316
