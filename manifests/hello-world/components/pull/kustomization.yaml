apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Lo que depende del MODELO (pull). Un Component se puede "enchufar" a cualquier entorno.
# Mismos colores que el Decision Framework de la charla.
labels:
- pairs:
    kcd.demo/model: pull

configMapGenerator:
- name: app-config
  behavior: merge
  literals:
  - MI_MODELO=PULL
  - MI_COLOR=#0d9488
