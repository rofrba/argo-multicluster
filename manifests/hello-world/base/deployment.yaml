apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  labels:
    app: hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
      - name: hello-world
        image: registry.redhat.io/rhel10/httpd-24:1790750455
        command: ["/bin/sh", "-c"]
        args:
          - |
            sed "s|VALUE_MI_ENTORNO|${MI_ENTORNO}|g" /tmp/template/index.html.template > /var/www/html/index.html && \
            exec container-entrypoint run-httpd
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: html-template-volume
          mountPath: /tmp/template
        # En OpenShift es una buena práctica (o requerimiento de SCC) ejecutar en puertos superiores al 1024
        # y configurar el puerto predeterminado de NGINX
      volumes:
      - name: html-template-volume
        configMap:
          name: html-template