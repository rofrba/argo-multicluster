<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KCD Argentina - Argo CD Multicluster</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f4f8; margin: 0; }
        .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); text-align: center; max-width: 440px; width: 100%; border-top: 8px solid VALUE_MI_COLOR; }
        h1 { color: #1e293b; font-size: 1.5rem; margin-bottom: 1rem; }
        p { color: #64748b; margin: 0.5rem 0; }
        .badge { background: VALUE_MI_COLOR; color: white; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: bold; font-size: 1.4rem; display: inline-block; margin: 0.5rem 0 1rem; letter-spacing: 0.05em; }
        .env { font-weight: bold; color: #1e293b; font-size: 1.1rem; }
        small { color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Argo CD Multicluster</h1>
        <p>Modelo de despliegue</p>
        <div class="badge">VALUE_MI_MODELO</div>
        <p>Entorno: <span class="env">VALUE_MI_ENTORNO</span></p>
        <small>pod: VALUE_POD</small>
    </div>
</body>
</html>
