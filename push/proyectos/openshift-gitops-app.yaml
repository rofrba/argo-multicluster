apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-gitops-bajos-app-push
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: 'openshift-gitops'
    server: 'https://kubernetes.default.svc'
  source:
    path: 'push/proyectos/openshift-gitops'
    repoURL: 'https://github.com/rofrba/argo-multicluster.git'
    targetRevision: main
  project: 'openshift-gitops-push'
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      allowEmpty: true
    syncOptions:
      - Validate=false
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true