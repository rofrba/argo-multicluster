apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer-hub-read-only-sa
  namespace: default
---
apiVersion: v1
kind: Secret
metadata:
  name: developer-hub-read-only-sa-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: developer-hub-read-only-sa
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: developer-hub-read-only-sa-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: developer-hub-read-only-sa
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-hub-tekton-reader
  namespace: default
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-hub-virtualization-reader
  namespace: default
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-hub-tekton-reader-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: developer-hub-read-only-sa
    namespace: default
roleRef:
  kind: Role
  name: developer-hub-tekton-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-hub-virtualization-reader-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: developer-hub-read-only-sa
    namespace: default
roleRef:
  kind: Role
  name: developer-hub-virtualization-reader
  apiGroup: rbac.authorization.k8s.io